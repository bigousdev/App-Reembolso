name: Build Android APK (teste)

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk reembolso-viagem-teste.apk

      - name: Publish release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-teste-${{ github.run_number }}
          name: "APK de teste #${{ github.run_number }}"
          body: |
            APK de teste (build release assinado com a chave de debug padrão — não é o build
            para publicar na Play Store, só para instalar manualmente e testar) gerado
            automaticamente a partir do commit ${{ github.sha }}.

            Para instalar: baixe o arquivo `reembolso-viagem-teste.apk` abaixo pelo navegador do
            celular e toque nele para instalar (é necessário permitir "instalar apps de fontes
            desconhecidas" para o navegador/gerenciador de arquivos usado).
          files: reembolso-viagem-teste.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
